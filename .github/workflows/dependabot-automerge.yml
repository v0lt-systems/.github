name: Dependabot auto-merge

# Opt-in, per repository. Turns on auto-merge (squash) for Dependabot's
# patch and minor updates; GitHub then merges once the ruleset's required
# checks (ci-ok) pass. Major updates stay for a human.
#
# Never call it where the merge to the default branch is the production
# gate (famille: docs/autonomy-rules.md).
#
# Usage, in .github/workflows/dependabot-automerge.yml of the repository:
#   on: pull_request
#   jobs:
#     automerge:
#       uses: v0lt-systems/.github/.github/workflows/dependabot-automerge.yml@main
#       permissions:
#         contents: write
#         pull-requests: write

on:
  workflow_call:

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ${{ vars.RUNNER_FORCE == 'github' && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '["self-hosted","pc-gaming"]') }}
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Enable auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
